<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBounty - Acceso y Registro</title>
    <!-- SDK oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; padding: 1rem; height: 100vh; overflow: hidden; margin: 0;">

    <div class="auth-container">
        
        <!-- Header / Logo -->
        <div class="text-center" style="margin-bottom: 1.5rem;">
            <h1 style="font-size: 1.875rem; font-weight: 800; color: #15803d;">🌱 AgroBounty</h1>
            <p class="text-xs" style="color: #64748b; margin-top: 0.25rem;">Del campo a un buen trato</p>
        </div>

        <!-- 1. LOGIN FORM -->
        <form id="loginForm">
            <h2 class="text-sm font-bold text-center" style="margin-bottom: 1rem;">Iniciar Sesión</h2>
            
            <div class="form-group">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="loginEmail" required class="input-field" placeholder="usuario@agrobounty.com">
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña / PIN</label>
                <div class="password-container">
                    <input type="password" id="loginPassword" required class="input-field" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)" title="Mostrar/Ocultar contraseña">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-green" style="margin-top: 0.5rem;">
                Entrar a la plataforma
            </button>

            <div class="text-center" style="margin-top: 1rem;">
                <button type="button" id="showRegister" class="btn-link">
                    ¿No tienes cuenta? Regístrate aquí
                </button>
            </div>
        </form>

        <!-- 2. REGISTER FORM (Oculto por defecto) -->
        <form id="registerForm" class="hidden">
            <h2 class="text-sm font-bold text-center" style="margin-bottom: 1rem;">Crear Cuenta Nueva</h2>
            
            <div class="form-group">
                <label class="form-label">Nombre completo o del negocio</label>
                <input type="text" id="regNombre" required class="input-field" placeholder="Ej. Finca El Juncal">
            </div>

            <div class="form-group">
                <label class="form-label">Correo electrónico</label>
                <input type="email" id="regEmail" required class="input-field" placeholder="correo@ejemplo.com">
            </div>

            <!-- NUEVO CAMPO DE TELÉFONO -->
            <div class="form-group">
                <label class="form-label">Teléfono de contacto</label>
                <input type="tel" id="regPhone" required class="input-field" placeholder="Ej. 4691234567">
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña / PIN</label>
                <div class="password-container">
                    <input type="password" id="regPassword" required class="input-field" placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)" title="Mostrar/Ocultar contraseña">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-green" style="margin-top: 0.5rem;">
                Registrarse y Entrar
            </button>

            <div class="text-center" style="margin-top: 1rem;">
                <button type="button" id="showLogin" class="btn-link">
                    ¿Ya tienes cuenta? Inicia sesión
                </button>
            </div>
        </form>

        <!-- Enlace a Sobre Nosotros -->
        <div class="text-center" style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
            <a href="nosotros.html" class="btn-link text-xs">
                © AgroBounty  •  ¿Quiénes somos?
            </a>
        </div>

    </div>

    <!-- Script de Supabase y Control de Auth -->
    <script>
        // Función global para alternar la visibilidad de la contraseña
        function togglePasswordVisibility(fieldId, btn) {
            const inputField = document.getElementById(fieldId);
            if (inputField.type === 'password') {
                inputField.type = 'text';
                btn.textContent = '👁️‍🗨️'; // Cambia el icono para indicar que está visible
            } else {
                inputField.type = 'password';
                btn.textContent = '👁️';
            }
        }

        const SUPABASE_URL = 'https://nxriaxzzvcrmzxxqghfl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Osb-UqwMymk_dnqNehpigw_kDuiDXhh'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const showRegisterBtn = document.getElementById('showRegister');
            const showLoginBtn = document.getElementById('showLogin');

            showRegisterBtn.addEventListener('click', () => {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            });

            showLoginBtn.addEventListener('click', () => {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const correo = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();

                try {
                    const { data: usuario, error } = await supabaseClient
                        .from('usuarios')
                        .select('*')
                        .eq('correo', correo)
                        .eq('pin_acceso', password)
                        .maybeSingle();

                    if (error || !usuario) {
                        alert('Correo o contraseña incorrectos.');
                    } else {
                        localStorage.setItem('usuarioAgroBounty', usuario.nombre || usuario.correo);
                        localStorage.setItem('correoAgroBounty', usuario.correo);
                        localStorage.setItem('usuarioId', usuario.id);
                        window.location.href = 'dashboard.html';
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('regNombre').value.trim();
                const correo = document.getElementById('regEmail').value.trim();
                const telefono = document.getElementById('regPhone').value.trim(); // <-- Obtenemos el teléfono
                const password = document.getElementById('regPassword').value.trim();

                try {
                    const { data, error } = await supabaseClient
                        .from('usuarios')
                        .insert([
                            { 
                                correo: correo, 
                                pin_acceso: password, 
                                nombre: nombre, 
                                phone: telefono // <-- Lo guardamos en tu columna 'phone'
                            }
                        ])
                        .select();

                    if (error) {
                        alert('Error al registrar: ' + error.message);
                    } else {
                        alert(`¡Cuenta creada con éxito para ${nombre}!`);
                        localStorage.setItem('usuarioAgroBounty', nombre);
                        localStorage.setItem('correoAgroBounty', correo);
                        localStorage.setItem('usuarioId', data[0]?.id || '');
                        window.location.href = 'dashboard.html';
                    }
                } catch (err) {
                    console.error('Error:', err);
                }
            });
        });
    </script>
</body>
</html>
