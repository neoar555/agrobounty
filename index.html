<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBounty - En Mantenimiento</title>
    <!-- Tus estilos actuales -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/jpeg" href="./assets/icon.jpg">
    <style>
        /* Estilos específicos y animados para la pantalla de mantenimiento */
        .maintenance-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            box-sizing: border-box;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
        }

        .maintenance-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(21, 128, 61, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* Elemento animado: Pulso verde */
        .pulse-icon-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dcfce7;
            border-radius: 50%;
        }

        .pulse-icon-container::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #16a34a;
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse-ring 2s infinite ease-out;
        }

        .pulse-emoji {
            font-size: 2.5rem;
            z-index: 2;
            animation: bounce-slow 3s infinite ease-in-out;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            70% {
                transform: scale(1.4);
                opacity: 0;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <div class="maintenance-wrapper">
        <div class="maintenance-card">
            
            <!-- Elemento Animado -->
            <div class="pulse-icon-container">
                <span class="pulse-emoji">🚜</span>
            </div>

            <!-- Título e Identidad -->
            <h1 style="font-size: 1.5rem; font-weight: 800; color: #15803d; margin-bottom: 0.5rem;">
                🌱 AgroBounty
            </h1>
            
            <!-- Mensaje clave solicitado -->
            <p class="text-sm font-bold" style="color: #1e293b; margin-bottom: 1rem;">
                AgroBounty está cultivando mejoras
            </p>

            <p class="text-xs" style="color: #64748b; line-height: 1.5; margin-bottom: 1.5rem;">
                Estamos actualizando la plataforma para ofrecerte una mejor experiencia en nuestras subastas express. Regresaremos en breve.
            </p>

            <!-- Pie de página informativo sin botones de navegación -->
            <div style="border-top: 1px solid #e2e8f0; padding-top: 1.25rem; margin-top: 0.5rem;">
                <span class="text-xs" style="color: #94a3b8;">© 2026 AgroBounty • Del campo a un buen trato</span>
            </div>

        </div>
    </div>

</body>
</html>
