<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBounty - Detalle del Lote</title>
    <!-- SDK oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; padding-bottom: 5rem;">

    <!-- Header superior con botón de regreso -->
    <header class="header-app">
        <div class="header-content">
            <a href="dashboard.html" class="btn-sm-green" style="background-color: #166534; text-decoration: none; padding: 0.375rem 0.75rem;">
                ← Volver
            </a>
            <h1 style="font-size: 1rem; font-weight: 700;">Detalle de Cosecha</h1>
            <div></div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-dashboard space-y-4" style="padding-top: 1rem;">
        
        <div id="contenedorDetalle" class="form-card space-y-4" style="padding: 1rem; overflow: hidden;">
            <p class="text-xs text-center" style="color: #64748b; padding: 1.5rem 0;">Cargando detalles del lote...</p>
        </div>

    </main>

    <!-- Modal Emergente para Realizar una Puja / Oferta -->
    <div id="modalOferta" class="modal-overlay hidden">
        <div class="modal-content space-y-4">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem;">
                <h3 class="font-bold text-sm" style="color: #1e293b;">🙋‍♂️ Realizar Oferta de Subasta</h3>
                <button type="button" onclick="cerrarModalOferta()" style="background: transparent; border: none; color: #94a3b8; font-weight: 700; cursor: pointer;">✕</button>
            </div>

            <div class="space-y-4">
                <p class="text-xs" style="color: #64748b;">Ingresa tu propuesta por tonelada. La oferta se enviará directamente al productor.</p>
                <div class="form-group">
                    <label class="form-label">Tu Oferta ($ MXN / tonelada)</label>
                    <input type="number" id="montoOferta" class="input-field" placeholder="Ej. 5500">
                </div>
            </div>

            <button type="button" onclick="enviarOferta()" class="btn-green" style="padding: 0.625rem;">
                Enviar Oferta por WhatsApp
            </button>
        </div>
    </div>

    <!-- Script de lógica dinámica -->
    <script>
        const SUPABASE_URL = 'https://nxriaxzzvcrmzxxqghfl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Osb-UqwMymk_dnqNehpigw_kDuiDXhh'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let loteActual = null;

        function obtenerImagenProducto(nombre) {
            const n = (nombre || '').toLowerCase();
            if (n.includes('maíz') || n.includes('maiz')) return 'https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=500&q=80';
            if (n.includes('tomate') || n.includes('jitomate')) return 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500&q=80';
            if (n.includes('trigo')) return 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500&q=80';
            if (n.includes('aguacate')) return 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=500&q=80';
            return 'https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500&q=80';
        }

        function calcularTiempoRestante(fechaExpiracionStr) {
            if (!fechaExpiracionStr) return 'Sin fecha';
            const fin = new Date(fechaExpiracionStr).getTime();
            const ahora = new Date().getTime();
            const dif = fin - ahora;

            if (dif <= 0) return '⏰ Expirado';

            const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            if (dias > 0) return `⏳ ${dias}d ${horas}h restantes`;
            return `⏳ ${horas}h restantes`;
        }

        // Función para limpiar el texto del GPS y mostrar sólo Municipio/Estado o Ubicación legible
        function formatearUbicacion(coordenadasGPS) {
            if (!coordenadasGPS) return 'Ubicación no especificada';
            
            let limpia = coordenadasGPS.replace(/📍/g, '').replace(/<[^>]*>?/gm, '').trim();
            
            if (limpia.includes('Lat:')) {
                limpia = limpia.split('Lat:')[0].trim();
            }
            if (limpia.includes('(')) {
                limpia = limpia.split('(')[0].trim();
            }

            return limpia || 'Municipio no especificado';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const loteId = params.get('id');
            const contenedor = document.getElementById('contenedorDetalle');

            const miUsuarioId = localStorage.getItem('usuarioId');
            const nombreActual = localStorage.getItem('usuarioAgroBounty');

            if (!loteId) {
                contenedor.innerHTML = `<p class="text-xs text-center" style="color: #ef4444;">No se especificó un lote válido.</p>`;
                return;
            }

            try {
                const { data: lote, error } = await supabaseClient
                    .from('lotes_alimentos')
                    .select('*')
                    .eq('id', loteId)
                    .single();

                if (error || !lote) throw new Error('Lote no encontrado');

                loteActual = lote;

                // Validar si el lote le pertenece al usuario logueado
                const esMiLote = (lote.usuario_id && lote.usuario_id == miUsuarioId) || 
                                 (lote.nombre_productor && lote.nombre_productor === nombreActual);

                const nombreProductorReal = lote.nombre_productor || 'Productor Local';
                const ubicacionLimpia = formatearUbicacion(lote.coordenadasGPS);

                let accionBotonHTML = '';
                if (esMiLote) {
                    accionBotonHTML = `
                        <div class="badge-disabled" style="width: 100%; padding: 0.75rem 0;">
                            🔒 Tu Publicación (No puedes ofertar en tu propio lote)
                        </div>
                    `;
                } else {
                    accionBotonHTML = `
                        <div class="space-y-4">
                            <button onclick="abrirModalOferta(${lote.precioBase})" class="btn-green" style="padding: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                                🙋‍♂️ Realizar Puja / Subastar
                            </button>
                            <button onclick="contactarWhatsApp('${nombreProductorReal}', '${lote.tipoProducto}', ${lote.id})" style="width: 100%; background-color: #dcfce7; color: #166534; font-weight: 700; font-size: 0.75rem; padding: 0.625rem; border-radius: 0.5rem; border: none; cursor: pointer;">
                                💬 Contactar a ${nombreProductorReal} vía WhatsApp
                            </button>
                        </div>
                    `;
                }

                contenedor.innerHTML = `
                    <img src="${obtenerImagenProducto(lote.tipoProducto)}" alt="${lote.tipoProducto}" class="lote-img" style="height: 12rem; border-radius: 0.75rem;">
                    
                    <div class="space-y-4">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h2 style="font-size: 1.25rem; font-weight: 700; color: #1e293b; text-transform: capitalize; margin: 0;">${lote.tipoProducto}</h2>
                            <span class="badge-time">
                                ${calcularTiempoRestante(lote.fechaExpiracion)}
                            </span>
                        </div>
                        
                        <p class="text-xs" style="color: #15803d; font-weight: 600; margin: 0;">👨‍🌾 Productor: ${nombreProductorReal}</p>
                        <p class="text-xs" style="color: #64748b; font-weight: 500; margin: 0;">📍 <strong>Ubicación:</strong> ${ubicacionLimpia}</p>
                        <p class="text-xs" style="color: #94a3b8; margin: 0;">Lote #${lote.id}</p>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; padding-top: 0.5rem; border-top: 1px solid #f1f5f9;" class="text-xs">
                        <div style="background-color: #f8fafc; padding: 0.75rem; border-radius: 0.5rem;">
                            <span style="color: #94a3b8; display: block;">Cantidad Disponible</span>
                            <strong style="color: #334155; font-size: 0.875rem;">${lote.pesoKg} toneladas</strong>
                        </div>
                        <div style="background-color: #f8fafc; padding: 0.75rem; border-radius: 0.5rem;">
                            <span style="color: #94a3b8; display: block;">Precio Base</span>
                            <strong style="color: #15803d; font-size: 0.875rem;">$${lote.precioBase.toLocaleString()} MXN/t</strong>
                        </div>
                    </div>

                    <div style="padding-top: 0.5rem;">
                        ${accionBotonHTML}
                    </div>
                `;

            } catch (err) {
                console.error(err);
                contenedor.innerHTML = `<p class="text-xs text-center" style="color: #ef4444;">Ocurrió un error al cargar la información del lote.</p>`;
            }
        });

        function abrirModalOferta(precioBase) {
            document.getElementById('montoOferta').value = precioBase + 500;
            document.getElementById('modalOferta').classList.remove('hidden');
        }

        function cerrarModalOferta() {
            document.getElementById('modalOferta').classList.add('hidden');
        }

        function enviarOferta() {
            const oferta = document.getElementById('montoOferta').value;
            if (!oferta || oferta <= 0) {
                alert('Por favor ingresa un monto válido.');
                return;
            }

            const nombreProductor = loteActual?.nombre_productor || 'Productor';
            const producto = loteActual?.tipoProducto || 'cosecha';
            const loteId = loteActual?.id || '';

            const mensaje = `Hola ${nombreProductor}, me interesa el lote #${loteId} de ${producto}. Quisiera hacer una oferta de subasta por $${parseInt(oferta).toLocaleString()} MXN por tonelada.`;
            
            window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
            cerrarModalOferta();
        }

        function contactarWhatsApp(productor, producto, loteId) {
            const mensaje = `Hola ${productor}, me interesa solicitar información sobre tu lote #${loteId} de ${producto}.`;
            window.open(`https://wa.me/?text=${encodeURIComponent(mensaje)}`, '_blank');
        }
    </script>
</body>
</html>
