<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroBounty - Tablero Principal</title>
    <!-- SDK oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="min-height: 100vh; padding-bottom: 5rem;">

    <!-- Header superior -->
    <header class="header-app">
        <div class="header-content">
            <div>
                <h1 style="font-size: 1.125rem; font-weight: 700;">🌱 AgroBounty</h1>
                <p class="text-xs" id="lblUsuario" style="color: #bbf7d0;">Cargando usuario...</p>
            </div>
            <!-- Botón de Notificaciones -->
            <button onclick="abrirNotificaciones()" class="btn-sm-green" style="background-color: #166534; display: flex; align-items: center; gap: 0.25rem; cursor: pointer;">
                🔔 <span style="background-color: #ef4444; color: #ffffff; font-size: 10px; padding: 0.1rem 0.35rem; border-radius: 9999px;">0</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal: Feed de Subastas -->
    <main class="main-dashboard space-y-4" style="padding-top: 1rem;">
        
        <!-- Barra de búsqueda rápida -->
        <div class="form-card" style="padding: 0.75rem;">
            <input type="text" placeholder="Buscar producto o productor..." style="width: 100%; font-size: 0.875rem; outline: none; padding: 0 0.5rem; color: #334155; border: none; background: transparent;">
        </div>

        <!-- Título de sección -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="text-sm font-bold" style="color: #334155;">Subastas Express Disponibles</h2>
            <span class="text-xs" style="color: #15803d; font-weight: 600;">Cerca de ti</span>
        </div>

        <!-- Contenedor donde aparecen las cosechas en tiempo real de Supabase -->
        <div id="listaLotes" class="space-y-4">
            <p class="text-xs text-center" style="color: #64748b; padding: 1rem 0;">Cargando cosechas...</p>
        </div>

    </main>

    <!-- Barra de Navegación Inferior Fija (Móvil) -->
    <nav class="nav-bottom">
        <div class="nav-content">
            <a href="dashboard.html" class="nav-item active">
                🏠 <span>Inicio</span>
            </a>
            <a href="publicar.html" class="nav-item">
                ➕ <span>Publicar</span>
            </a>
            <a href="cuenta.html" class="nav-item">
                👤 <span>Mi Cuenta</span>
            </a>
        </div>
    </nav>

    <!-- Modal de Notificaciones -->
    <div id="modalNotif" class="modal-overlay hidden">
        <div class="modal-content text-center">
            <h3 class="font-bold text-sm" style="color: #1e293b;">🔔 Notificaciones</h3>
            <p class="text-xs" style="color: #64748b;">No hay notificaciones nuevas por el momento. ¡Todo marcha bien en el campo!</p>
            <button onclick="cerrarNotificaciones()" class="btn-green text-xs" style="padding: 0.5rem;">
                Entendido
            </button>
        </div>
    </div>

    <!-- Script del Dashboard -->
    <script>
        const SUPABASE_URL = 'https://nxriaxzzvcrmzxxqghfl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Osb-UqwMymk_dnqNehpigw_kDuiDXhh'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Imagen de respaldo por si algún lote antiguo no tiene foto
        function obtenerImagenProducto(nombre) {
            const n = (nombre || '').toLowerCase();
            if (n.includes('maíz') || n.includes('maiz')) return 'https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=500&q=80';
            if (n.includes('tomate') || n.includes('jitomate')) return 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=500&q=80';
            if (n.includes('trigo')) return 'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=500&q=80';
            if (n.includes('aguacate')) return 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?w=500&q=80';
            // return 'https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500&q=80';
        }

        function calcularTiempoRestante(fechaExpiracionStr) {
            if (!fechaExpiracionStr) return 'Sin fecha';
            const fin = new Date(fechaExpiracionStr).getTime();
            const ahora = new Date().getTime();
            const dif = fin - ahora;

            if (dif <= 0) return '⏰ Expirado';

            const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
            const horas = Math.floor((dif % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            if (dias > 0) return `⏳ ${dias}d ${horas}h restantes`;
            return `⏳ ${horas}h restantes`;
        }

        function abrirNotificaciones() {
            document.getElementById('modalNotif').classList.remove('hidden');
        }

        function cerrarNotificaciones() {
            document.getElementById('modalNotif').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const lblUsuario = document.getElementById('lblUsuario');
            const nombreActual = localStorage.getItem('usuarioAgroBounty');
            const miUsuarioId = localStorage.getItem('usuarioId');
            
            if (!nombreActual && !miUsuarioId) {
                window.location.href = 'index.html';
                return;
            }

            if (lblUsuario) {
                lblUsuario.textContent = `Hola, ${nombreActual}`;
            }

            // Cargar Lotes desde Supabase
            const contenedorLotes = document.getElementById('listaLotes');
            if (!contenedorLotes) return;

            try {
                const { data: lotes, error } = await supabaseClient
                    .from('lotes_alimentos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!lotes || lotes.length === 0) {
                    contenedorLotes.innerHTML = `<p class="text-xs text-center" style="color: #64748b; padding: 1rem 0;">No hay lotes publicados todavía.</p>`;
                    return;
                }

                contenedorLotes.innerHTML = '';
                lotes.forEach(lote => {
                    const esMiLote = (lote.usuario_id && lote.usuario_id == miUsuarioId) || 
                                     (lote.nombre_productor && lote.nombre_productor === nombreActual);

                    let accionBotonHTML = '';
                    if (esMiLote) {
                        accionBotonHTML = `
                            <span class="badge-disabled">
                                🔒 Tu Publicación
                            </span>
                        `;
                    } else {
                        accionBotonHTML = `
                            <a href="detalle.html?id=${lote.id}" class="btn-sm-green" style="display: inline-block; text-decoration: none;">
                                🔍 Ver Detalle
                            </a>
                        `;
                    }

                    // Validar unidad de medida (Kg o Ton)
                    const unidadMedida = lote.unidadMedida || 'Ton';
                    const etiquetaUnidad = unidadMedida === 'Kg' ? 'kg' : 't';
                    const etiquetaPrecio = unidadMedida === 'Kg' ? 'MXN/kg' : 'MXN/t';

                    // Usar la foto real subida a Supabase, o la de respaldo si no existe
                    const fotoAMostrar = lote.foto_url || obtenerImagenProducto(lote.tipoProducto);

                    const card = document.createElement('div');
                    card.className = 'lote-card';
                    
                    card.innerHTML = `
                        <img src="${fotoAMostrar}" alt="${lote.tipoProducto}" class="lote-img">
                        <div class="lote-body">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div>
                                    <h3 class="font-bold text-sm" style="color: #1e293b; text-transform: capitalize; margin: 0;">${lote.tipoProducto}</h3>
                                    <p class="text-xs" style="color: #15803d; font-weight: 600; margin: 0.25rem 0 0 0;">👨‍🌾 Productor: ${lote.nombre_productor || 'Productor Local'}</p>
                                    <p class="text-xs" style="color: #94a3b8; margin: 0;">Lote: #${lote.id}</p>
                                </div>
                                <span class="badge-time">
                                    ${calcularTiempoRestante(lote.fechaExpiracion)}
                                </span>
                            </div>
                            <p class="text-xs" style="color: #475569; margin: 0;">⚖️ <strong>Cantidad:</strong> ${lote.pesoKg} ${etiquetaUnidad}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; border-top: 1px solid #f1f5f9;">
                                <div>
                                    <span class="text-xs" style="color: #94a3b8; display: block;">Precio base</span>
                                    <span style="font-weight: 800; color: #15803d; font-size: 0.875rem;">$${lote.precioBase.toLocaleString()} ${etiquetaPrecio}</span>
                                </div>
                                ${accionBotonHTML}
                            </div>
                        </div>
                    `;
                    contenedorLotes.appendChild(card);
                });

            } catch (err) {
                console.error('Error al cargar datos:', err);
                contenedorLotes.innerHTML = `<p class="text-xs text-center" style="color: #dc2626; padding: 1rem 0;">Error al cargar datos de Supabase.</p>`;
            }
        });
    </script>
</body>
</html>
